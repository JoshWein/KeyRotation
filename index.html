<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Key Rotation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <script src="keyRotation.js"></script>
</head>
<body class="container-fluid text-center">
<div class="row">
    <div class="col-md-12">
        <h1>Key Rotation Decrypt/Encrypt</h1></div>
</div>
<div class="row">
    <div class="col-md-12">
        <div>
            <input type="text" class="form-control" id="key" placeholder="Key">
        </div>
    </div>
</div>
<div class="row">
    <div class="col-md-12">
        <textarea class="form-control" placeholder="Encrypted text here" id="encryptedText"></textarea>
    </div>
</div>
<div class="row">
            <div class="col-12 col-md-6 mb-2 mb-md-0">
                <button class="btn btn-secondary" onclick="decrypt()">
                    <span aria-hidden="true">&darr;</span>
                    Decrypt
                    <span aria-hidden="true">&darr;</span>
                </button>
            </div>
            <div class="col-12 col-md-6">
                <button class="btn btn-secondary" onclick="encrypt()">
                    <span aria-hidden="true">&uarr;</span>
                    Encrypt
                    <span aria-hidden="true">&uarr;</span>
                </button>
            </div>
</div>
<div class="row">
    <div class="col-md-12">
        <textarea class="form-control" placeholder="Clear text here" id="decryptedText"></textarea>
    </div>
</div>
<div class="row">
    <div class="col-md-12">
        <h3>Notes</h3>
        <ul class="list-unstyled">
        <li>Keys are always converted to lowercase.</li>
        <li>Any non letter characters are ignored and passed through unencrypted/decrypted.</li>
        </ul>
    </div>
</div>
<div class="row">
    <div class="col-md-12">
        <h3>Samples</h3>
        <h4>Key</h4>
        <p>ABCDABCDABCDABCDABCDABCDABCD</p>
        <h4>Text</h4>
        <p>CSASTPKVSIQUTGQUCSASTPIUAQJB</p>
    </div>
</div>
</body>
</html>
